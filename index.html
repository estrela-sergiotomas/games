<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em Breve - Games</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }
        .scene {
            position: relative;
            width: 200px;
            height: 300px;
            margin-bottom: 40px;
        }
        .ball {
            position: absolute;
            left: 50%;
            top: 0;
            width: 60px;
            height: 60px;
            margin-left: -30px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ff6b6b, #c0392b);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
            animation: bounce 1s ease-in infinite;
        }
        .shadow {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 60px;
            height: 14px;
            margin-left: -30px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            animation: shadow-shrink 1s ease-in infinite;
        }
        @keyframes bounce {
            0%   { top: 0; animation-timing-function: ease-in; }
            50%  { top: 220px; height: 50px; width: 70px; margin-left: -35px; border-radius: 50%; animation-timing-function: ease-out; }
            55%  { top: 230px; height: 40px; width: 75px; margin-left: -37px; border-radius: 45%; }
            60%  { top: 220px; height: 50px; width: 70px; margin-left: -35px; border-radius: 50%; }
            100% { top: 0; }
        }
        @keyframes shadow-shrink {
            0%   { transform: scale(0.5); opacity: 0.3; }
            50%  { transform: scale(1.2); opacity: 0.8; }
            55%  { transform: scale(1.3); opacity: 0.9; }
            60%  { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(0.5); opacity: 0.3; }
        }
        .text {
            color: #e0e0e0;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            animation: pulse 2s ease-in-out infinite;
        }
        .text span {
            color: #ff6b6b;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50%      { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="ball"></div>
        <div class="shadow"></div>
    </div>
    <p class="text">Isso em breve será um <span>jogo</span></p>
</body>
</html>
