<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f0f23">
    <title>Aviatore</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #0f0f23;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            touch-action: manipulation;
        }

        /* ===== SPLASH SCREEN ===== */
        #splash {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0f0f23;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease-out;
        }
        #splash.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .splash-plane {
            width: 120px;
            height: 60px;
            margin-bottom: 40px;
            animation: splash-float 2s ease-in-out infinite;
        }
        @keyframes splash-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .splash-title {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #4ecdc4, #ffd700, #ff4757);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: splash-gradient 3s ease infinite;
            margin-bottom: 30px;
        }
        @keyframes splash-gradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .splash-loader {
            width: 200px;
            height: 4px;
            background: #1a1a3e;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .splash-loader-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #4ecdc4, #ffd700);
            border-radius: 4px;
            transition: width 0.3s;
        }
        .splash-text {
            color: #555;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ===== GAME CONTAINER ===== */
        #game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        #game-container canvas {
            max-width: 100vw;
            max-height: 100vh;
        }
    </style>
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash">
        <svg class="splash-plane" viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="8" cy="30" rx="10" ry="6" fill="#ff6600" opacity="0.7">
                <animate attributeName="rx" values="8;12;8" dur="0.2s" repeatCount="indefinite"/>
            </ellipse>
            <ellipse cx="10" cy="30" rx="6" ry="4" fill="#ffcc00" opacity="0.9">
                <animate attributeName="rx" values="5;7;5" dur="0.15s" repeatCount="indefinite"/>
            </ellipse>
            <path d="M30 20 Q15 30 30 40 L90 40 Q105 30 90 20 Z" fill="#cc2233"/>
            <ellipse cx="75" cy="24" rx="10" ry="6" fill="#dd3344"/>
            <ellipse cx="77" cy="23" rx="6" ry="4" fill="#1a1a3e"/>
            <ellipse cx="76" cy="22" rx="3" ry="2" fill="#4ecdc4" opacity="0.4"/>
            <rect x="40" y="12" width="35" height="5" rx="2" fill="#bb1122"/>
            <rect x="40" y="43" width="35" height="5" rx="2" fill="#bb1122"/>
            <polygon points="25,20 35,10 40,20" fill="#cc2233"/>
            <rect x="22" y="17" width="14" height="4" rx="2" fill="#bb1122"/>
            <rect x="22" y="39" width="14" height="4" rx="2" fill="#bb1122"/>
            <rect x="92" y="23" width="8" height="14" rx="3" fill="#666"/>
            <ellipse cx="102" cy="30" rx="3" ry="14" fill="#ccc" opacity="0.4">
                <animate attributeName="ry" values="12;16;12" dur="0.1s" repeatCount="indefinite"/>
            </ellipse>
        </svg>
        <div class="splash-title">AVIATORE</div>
        <div class="splash-loader">
            <div class="splash-loader-bar" id="loader-bar"></div>
        </div>
        <div class="splash-text" id="splash-status">Carregando...</div>
    </div>

    <div id="game-container"></div>

    <script>
        const loaderBar = document.getElementById('loader-bar');
        const splashStatus = document.getElementById('splash-status');
        const steps = ['Inicializando...', 'Carregando texturas...', 'Gerando musica...', 'Preparando jogo...'];
        let progress = 0;

        const loadInterval = setInterval(() => {
            progress += Math.random() * 15 + 5;
            if (progress > 85) progress = 85;
            const stepIdx = Math.min(Math.floor(progress / 25), steps.length - 1);
            loaderBar.style.width = progress + '%';
            splashStatus.textContent = steps[stepIdx];
        }, 200);

        window.addEventListener('game-ready', () => {
            clearInterval(loadInterval);
            loaderBar.style.width = '100%';
            splashStatus.textContent = 'Pronto!';
            setTimeout(() => {
                document.getElementById('splash').classList.add('hidden');
                setTimeout(() => document.getElementById('splash').remove(), 800);
            }, 400);
        });
    </script>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
